<div>
    <!-- Trigger the Modal -->
    <figure class="figure">
        <img src="{{ imgUrl | relative_url }}" class="figure-img img-fluid rounded modalImg" alt="{{ imgAlt }}" style="{{ imgWidth }}" href="{{ '#modal' | append: modalId }}">
        <figcaption class="figure-caption">{{ imgCaption }}</figcaption>
    </figure>

    <!-- The Modal -->
    <div id="{{ 'modal' | append: modalId }}" class="modal">

    <!-- The Close Button -->
    <span class="close">&times;</span>

    <!-- Modal Content (The Image) -->
    <img class="modal-content" src="{{ imgUrl | relative_url }}" alt="{{ imgAlt }}">

    <!-- Modal Caption (Image Text) -->
    <div class="modalCaption">{{ imgCaption }}</div>
    </div> 
</div>
