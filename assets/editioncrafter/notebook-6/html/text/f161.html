<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>wa´likati
<tei-lb data-origname="lb" data-empty=""></tei-lb> = she calls
<tei-lb data-origname="lb" data-empty=""></tei-lb>takapac wa´likati
<tei-lb data-origname="lb" data-empty=""></tei-lb> = she calls the chicken
<tei-lb data-origname="lb" data-empty=""></tei-lb>ta´kapac ka´pac'uhk ra´hk'ɔki
<tei-lb data-origname="lb" data-empty=""></tei-lb> = the hen laid an egg
<tei-lb data-origname="lb" data-empty=""></tei-lb>ta´kapacik ha´raku
<tei-lb data-origname="lb" data-empty=""></tei-lb> = the rooster crows
<tei-lb data-origname="lb" data-empty=""></tei-lb>ta´kapac wa´haka´ti
<tei-lb data-origname="lb" data-empty=""></tei-lb> = the hen cackles
</tei-ab>
