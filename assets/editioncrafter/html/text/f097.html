<tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="text" id="text" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f097" data-origname="pb" data-empty=""></tei-pb>
<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>ha´hpaya
<tei-lb data-origname="lb" data-empty=""></tei-lb> = ​noise
<tei-lb data-origname="lb" data-empty=""></tei-lb>'i´mą ha´hpaya ya´kani
<tei-lb data-origname="lb" data-empty=""></tei-lb> = I'm making a noise
<tei-lb data-origname="lb" data-empty=""></tei-lb>'u´wį ha´hpaya ya´ku
<tei-lb data-origname="lb" data-empty=""></tei-lb> = he is making noise
<tei-lb data-origname="lb" data-empty=""></tei-lb>taha´hpayac 'a´ra
<tei-lb data-origname="lb" data-empty=""></tei-lb> = the noise is there
<tei-lb data-origname="lb" data-empty=""></tei-lb>'aparu
<tei-lb data-origname="lb" data-empty=""></tei-lb> = cloud
<tei-lb data-origname="lb" data-empty=""></tei-lb>ta´paruc 'a´ra
<tei-lb data-origname="lb" data-empty=""></tei-lb> = the cloud lies
<tei-lb data-origname="lb" data-empty=""></tei-lb>ka´na hi´lakati wi´hk'atą
<tei-lb data-origname="lb" data-empty=""></tei-lb> = I hear something moving
<tei-lb data-origname="lb" data-empty=""></tei-lb>ha´hpaya wi´hk'atą
<tei-lb data-origname="lb" data-empty=""></tei-lb> = I hear noise
</tei-ab>

</tei-div></tei-body></tei-text>
