
            <tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="text" id="text" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f088" data-origname="pb" data-empty=""></tei-pb>
        
<div class="text">
<p class="note">Just how these two parts go together, I</p>
<p class="note">do not know as yet.</p>
<p class="note">In Marksville I hope</p>
<p class="note">to make a record with two people singing.</p>
<p class="note">I do not know whether the rhythm</p>
<p class="note">of the two parts is the same or not, but</p>
<p class="note">at any rate the two parts are sung</p>
<p class="note">at the same time.</p>
</div>

            </tei-div></tei-body></tei-text>
