<div class="text">
<p class="elicitation">'a´hpasala´mihta = an animal that lived in the water</p>
<p class="elicitation">la´mihta = soft</p>
<p class="elicitation">ti´rata´pohku = quilt, blanket</p>
<p class="elicitation">nä´htali = bed</p>
<p class="elicitation">ku´ma = to close up</p>
<p class="elicitation">'i´mą 'i´cohu le´hp'ähkini = I closed my mouth.</p>
<p class="note">'i´cohu  ku´m'ahkini  v.I</p>
