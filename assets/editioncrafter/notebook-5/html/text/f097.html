<div class="text">
<p class="elicitation">ha´hpaya = ​noise</p>
<p class="elicitation">'i´mą ha´hpaya ya´kani = I'm making a noise</p>
<p class="elicitation">'u´wį ha´hpaya ya´ku = he is making noise</p>
<p class="elicitation">taha´hpayac 'a´ra = the noise is there</p>
<p class="elicitation">'aparu = cloud</p>
<p class="elicitation">ta´paruc 'a´ra = the cloud lies</p>
<p class="elicitation">ka´na hi´lakati wi´hk'atą = I hear something moving</p>
<p class="elicitation">ha´hpaya wi´hk'atą = I hear noise</p>
