<tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="text" id="text" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f075" data-origname="pb" data-empty=""></tei-pb>
<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>la´pu
<tei-lb data-origname="lb" data-empty=""></tei-lb> = to sell
<tei-lb data-origname="lb" data-empty=""></tei-lb>ta´rita´lapu
<tei-lb data-origname="lb" data-empty=""></tei-lb> = store
<tei-lb data-origname="lb" data-empty=""></tei-lb>ka´nahku la´p'iwa´na
<tei-lb data-origname="lb" data-empty=""></tei-lb> = I want to buy something
<tei-lb data-origname="lb" data-empty=""></tei-lb>ka´nahk'ula´p'iwana
<tei-lb data-origname="lb" data-empty=""></tei-lb> = I want to sell something
<tei-lb data-origname="lb" data-empty=""></tei-lb>ma´hk'aha
<tei-lb data-origname="lb" data-empty=""></tei-lb> = It's cheap
<tei-lb data-origname="lb" data-empty=""></tei-lb>ma´hka
<tei-lb data-origname="lb" data-empty=""></tei-lb> = It's high
<tei-lb data-origname="lb" data-empty=""></tei-lb>ma´hkapa´nu
<tei-lb data-origname="lb" data-empty=""></tei-lb> = It's very high
<tei-lb data-origname="lb" data-empty=""></tei-lb>ma´ruwi
<tei-lb data-origname="lb" data-empty=""></tei-lb> = he turned back
<tei-lb data-origname="lb" data-empty=""></tei-lb>ma´riwi
<tei-lb data-origname="lb" data-empty=""></tei-lb> = he gathered
</tei-ab>

</tei-div></tei-body></tei-text>
