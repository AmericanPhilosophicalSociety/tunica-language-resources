<div class="text">
<p class="note">Record Number 45</p>
<p class="note">After-midnight Dance</p>
<p class="note">Pitch of A is recorded in the beginning of</p>
<p class="note">Record Number 46.</p>
<p class="note">The singing is a little</p>
<p class="note">blurred sometimes on this record, possibly</p>
<p class="note">because he was singing too loud too close in</p>
<p class="note">the mouthpiece (?).</p>
<p class="note">(See next page for words)</p>
