
            <tei-text data-xmlns="http://www.tei-c.org/ns/1.0" xml:id="text" id="text" data-origname="text"><tei-body data-origname="body"><tei-div data-origname="div"><tei-pb facs="#f161" data-origname="pb" data-empty=""></tei-pb>
        
<div class="text">
<p class="elicitation">wa´likati = she calls</p>
<p class="elicitation">takapac wa´likati = she calls the chicken</p>
<p class="elicitation">ta´kapac ka´pac'uhk ra´hk'ɔki = the hen laid an egg</p>
<p class="elicitation">ta´kapacik ha´raku = the rooster crows</p>
<p class="elicitation">ta´kapac wa´haka´ti = the hen cackles</p>
</div>
