<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title }} - {{ site.title }}</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CD2X5VV4CJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CD2X5VV4CJ');
    </script>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css"/> -->
    {% if page.title == "EditionCrafter Test" %}
      <link rel="stylesheet" href="{{ 'assets/editioncrafter/editioncrafter.css' | relative_url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css"/> -->
    <link rel="shortcut icon" type="image/ico" href="{{ '/assets/img/favicon.ico' | relative_url }}">
		<script src="https://kit.fontawesome.com/4fd7da23e2.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class='header'>
      {% include nav.html %}
    </header>
    <div>
        {{ content }}
    </div>
    <footer id='footer'>
      {% include footer.html %}
    </footer>
    <script src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
