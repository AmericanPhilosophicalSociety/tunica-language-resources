<p class="elicitation">ta´siwat'äk = a mammoth</p>
<p class="note">an animal bigger than</p>
<p class="note">an elephant that used to live near</p>
<p class="note">Opelousas at Mammouth Prairie</p>
<p class="note">metathesis ʔupi´rtakä´ni turn into; become v.T.tr = ʔupi´rakatä´ni turn into; become v.T.tr.</p>
