<div id="editioncrafter-nav">
    <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center pagination-lg">
        {% if page.num > 5 %}
            <li class="page-item"><a class="page-link" href="{{ notebook_path | append: prev_notebook | relative_url }}">&laquo; Previous Notebook</a></li>
        {% else %}
            <li class="page-item disabled"><a class="page-link" href="#">&laquo; Previous Notebook</a></li>
        {% endif %}
            <li class="page-item"><a class="page-link" href="{{ 'notebooks' | relative_url }}">Contents</a></li>
        {% if page.num < 7 %}
            <li class="page-item"><a class="page-link" href="{{ notebook_path | append: next_notebook | relative_url }}">Next Notebook &raquo;</a></li>
        {% else %}
            <li class="page-item disabled"><a class="page-link" href="#">Next Notebook &raquo;</a></li>
        {% endif %}
    </ul>
    </nav>
</div>
