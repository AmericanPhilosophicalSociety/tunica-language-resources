<div>
    <!-- Trigger the Modal -->
    <figure class="figure">
        <img id="{{ 'figureImg' | append: modalId }}" src="{{ imgUrl | relative_url }}" class="figure-img img-fluid rounded modalImg" alt="{{ imgAlt }}" style="{{ imgWidth }}" href="{{ '#modal' | append: modalId }}">
        <figcaption class="figure-caption" id="{{ 'caption' | append: modalId }}">{{ imgCaption }}</figcaption>
    </figure>

    <!-- The Modal -->
    <div id="{{ 'modal' | append: modalId }}" class="modal">

    <!-- The Close Button -->
    <span class="close">&times;</span>

    <!-- Modal Content (The Image) -->
    <img class="modal-content" id="{{ 'img' | append: modalId }}" src="{{ imgUrl | relative_url }}">

    <!-- Modal Caption (Image Text) -->
    <div id="{{ 'caption' | append: modalId }}" class="modalCaption">{{ imgCaption }}</div>
    </div> 
</div>
