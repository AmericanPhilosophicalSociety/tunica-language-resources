<p class="note">See p. 1</p>
<p class="note">There used to be an Owl - mammoth.</p>
<p class="note">There was a (certain) village.</p>
<p class="note">Every night he (would) arrive and (when) he came into the village he (would) swallow two or three people [ every night ].</p>
