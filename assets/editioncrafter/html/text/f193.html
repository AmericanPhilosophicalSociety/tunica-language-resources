<tei-ab data-origname="ab">
<tei-lb data-origname="lb" data-empty=""></tei-lb>Translation 
<tei-lb data-origname="lb" data-empty=""></tei-lb> = 
<tei-lb data-origname="lb" data-empty=""></tei-lb>See p. 1
<tei-lb data-origname="lb" data-empty=""></tei-lb> = 
<tei-lb data-origname="lb" data-empty=""></tei-lb>There used to be an Owl-mammoth. 
<tei-lb data-origname="lb" data-empty=""></tei-lb> = 
<tei-lb data-origname="lb" data-empty=""></tei-lb>There was a (certain) village. 
<tei-lb data-origname="lb" data-empty=""></tei-lb> = 
<tei-lb data-origname="lb" data-empty=""></tei-lb>Every night he (would) arrive and (when) he came into the village he (would) swallow two or three people [every night].
