<div class="text">
<p class="elicitation">mu´riku = something you fill up and pack it</p>
<p class="elicitation">mu´riwik'a´htca = he's going to fill it up (pack it full)</p>
<p class="elicitation">'i´mą 'ito´su = my seed</p>
<p class="elicitation">'i´mą 'ik'e´lu = my fruit</p>
<p class="elicitation">'i´mą 'ihtuhura = my island</p>
