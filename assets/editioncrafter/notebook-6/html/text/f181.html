<p class="elicitation">'ɔ´ha = to bet</p>
<p class="elicitation">'ɔ´haka´ni = I'm betting</p>
<p class="elicitation">tco´ka˳i = guinea</p>
<p class="note">*? 'ɔ´sac tail ?</p>
<p class="note">inf.</p>
<p class="note">said 'ɔ´sak  n</p>
<p class="note">'ɔsa  n is probably fem.,</p>
<p class="note">but " deer " is masc.</p>
<p class="note">and so inf.</p>
<p class="note">becomes confused and says sometimes 'ɔsac  n and sometimes 'ɔ´sak  n</p>
<p class="elicitation">pa´law'i = if he wins</p>
<p class="elicitation">pa´nuw'i = if he passes</p>
<p class="elicitation">lɔ´tą = running</p>
